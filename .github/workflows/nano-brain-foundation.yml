name: Nano Brain Foundation Part 2 Tests

on:
  push:
    branches:
      - main
      - feat/nano-brain-foundation-part2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    name: Nano Brain foundation regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check Nano Brain modules
        shell: bash
        run: |
          set -euo pipefail
          find assets/js/brain assets/js/pages -type f -name '*part2.js' -print0 |
            while IFS= read -r -d '' file; do
              node --experimental-default-type=module --check "$file"
            done
      - name: Install Chrome for real IndexedDB browser tests
        uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Test IndexedDB persistence across browser restarts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 --directory . > "$RUNNER_TEMP/brain-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8765/assets/js/brain/brain-browser-test-part2.html > /dev/null; then
              break
            fi
            sleep 1
          done
          chrome="${{ steps.chrome.outputs.chrome-path }}"
          npm install --no-save --no-package-lock playwright
          CHROME_PATH="$chrome" BRAIN_TEST_URL="http://127.0.0.1:8765/assets/js/brain/brain-browser-test-part2.html" node --experimental-default-type=module assets/js/brain/brain-browser-test-runner-part2.mjs
      - name: Run Nano Brain foundation self-tests
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module --input-type=module <<'NODE'
          import { selfTest } from "./assets/js/brain/brain-foundation-selftest-part2.js";
          const result = await selfTest();
          for (const suite of result.suites) {
            console.log(`${suite.status} ${suite.name}: ${suite.passed}/${suite.total}`);
            for (const check of suite.checks) {
              if (!check.passed) console.error(`  - FAIL ${check.id}`);
            }
          }
          console.log(`Nano Brain Foundation: ${result.passed}/${result.total}`);
          if (result.status !== "PASSED") process.exitCode = 1;
          NODE
