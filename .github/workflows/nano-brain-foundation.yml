name: Nano Brain Foundation Verification

on:
  push:
    branches:
      - main
      - feat/nano-brain-foundation-part2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nano-brain-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  foundation:
    name: Local Foundation and Chromium Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install pinned Playwright test dependency
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.65.1
          npx playwright install chromium --with-deps
          node --version
          npm --version
          node -e 'console.log("Playwright Chromium executable:", require("playwright").chromium.executablePath())'

      - name: Verify JavaScript and Runner syntax
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --experimental-default-type=module --check "$file"
            count=$((count + 1))
          done < <(find assets/js -type f -name '*.js' -print0 | sort -z)
          test "$count" -gt 0
          node --check assets/js/brain/brain-browser-test-runner-part2.mjs
          echo "PASS: syntax checked $count JavaScript files and the Browser Test Runner."

      - name: Run independent Security, Integration, and Page self-tests
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module --input-type=module <<'NODE'
          import { selfTest as securityTest } from "./assets/js/brain/brain-security-part2.js";
          import { selfTest as integrationTest } from "./assets/js/brain/brain-integration-foundation-part2.js";
          import { selfTest as pageTest } from "./assets/js/pages/page-nano-brain-part2.js";

          const suites = [
            ["Security Foundation", securityTest],
            ["Integration Foundation", integrationTest],
            ["Nano Brain Page", pageTest]
          ];
          let total = 0;
          let passed = 0;
          for (const [name, run] of suites) {
            const result = await run();
            const valid = result && result.status === "PASSED" &&
              Number.isInteger(result.total) && Number.isInteger(result.passed) &&
              Number.isInteger(result.failed) && result.failed === 0 &&
              result.passed === result.total && Array.isArray(result.checks) &&
              result.checks.length === result.total && result.checks.every(check => check && check.passed === true);
            console.log(`${valid ? "PASS" : "FAIL"} ${name}: ${result?.passed ?? 0}/${result?.total ?? 0}`);
            total += result?.total || 0;
            passed += result?.passed || 0;
            if (!valid) {
              for (const check of result?.checks || []) {
                if (!check?.passed) console.error("  FAIL " + (check?.id || "unknown-check"));
              }
              throw new Error(name + " self-test failed or returned an invalid contract.");
            }
          }
          console.log(`Security + Integration + Page self-tests: ${passed}/${total} PASS.`);
          NODE

      - name: Explain Storage aggregate self-test scope
        shell: bash
        run: |
          set -euo pipefail
          echo "Storage is tested by the real IndexedDB Browser Audit below."
          echo "The aggregate brain-foundation-selftest suite is not invoked in this workflow yet: its current Storage self-test has an async OPFS path-validation assertion that is not awaited. It must be corrected in its own one-file commit before the aggregate suite can be enabled."

      - name: Run real Chromium IndexedDB, migration, and cross-process persistence audit
        shell: bash
        env:
          BRAIN_REPO_ROOT: ${{ github.workspace }}
        run: |
          set -euo pipefail
          CHROME_PATH="$(node -e 'process.stdout.write(require("playwright").chromium.executablePath())')"
          test -x "$CHROME_PATH"
          echo "Chromium executable: $CHROME_PATH"
          CHROME_PATH="$CHROME_PATH" BRAIN_REPO_ROOT="$BRAIN_REPO_ROOT" \
            node assets/js/brain/brain-browser-test-runner-part2.mjs
