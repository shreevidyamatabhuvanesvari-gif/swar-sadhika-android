<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nano Brain IndexedDB Browser Test</title>
  <style>
    body{font:16px system-ui,sans-serif;padding:24px;max-width:720px;margin:auto}
    #result{white-space:pre-wrap;padding:16px;border:1px solid #888;border-radius:8px}
    .pass{color:#087a35}.fail{color:#b42318}
  </style>
</head>
<body>
  <h1>Nano Brain IndexedDB Browser Test</h1>
  <p>यह परीक्षण केवल अलग test database का उपयोग करता है।</p>
  <pre id="result">RUNNING</pre>
  <script type="module">
    import { createBrainStoragePart2 } from "./brain-storage-part2.js";
    const output = document.getElementById("result");
    const params = new URLSearchParams(location.search);
    const phase = params.get("phase");
    const database = "swar-sadhika-brain-browser-ci-test";
    const checks = [];
    const check = (id, passed) => checks.push({id, passed: Boolean(passed)});
    const finish = (extra = "") => {
      const failed = checks.filter(item => !item.passed);
      output.className = failed.length ? "fail" : "pass";
      output.textContent = checks.map(item => (item.passed ? "PASS " : "FAIL ") + item.id).join("\n") +
        "\nRESULT " + (failed.length ? "FAILED" : "PASSED") + " " + checks.filter(item => item.passed).length + "/" + checks.length + extra;
      document.title = failed.length ? "FAILED" : "PASSED";
      document.documentElement.dataset.result = failed.length ? "FAILED" : "PASSED";
    };
    try {
      const store = await createBrainStoragePart2({host: window, dbName: database, allowVolatileFallback: false});
      const diagnostics = await store.diagnostics();
      check("native-indexeddb-selected", diagnostics.backend === "indexeddb" && diagnostics.persistent === true);
      if (phase === "write") {
        await store.putRecord({id:"browser-persistence-check", kind:"browser-ci", value:"survives-reopen", revision:1});
        await store.putMetadata("browser-ci-meta", {phase:"write", origin:location.origin});
        await store.appendEvent({id:"browser-ci-event", type:"persistence-write"});
        check("record-write-completed", (await store.getRecord("browser-persistence-check")).value === "survives-reopen");
        check("metadata-write-completed", (await store.getMetadata("browser-ci-meta")).phase === "write");
        check("event-write-completed", (await store.listEvents()).some(item => item.id === "browser-ci-event"));
        await store.dispose();
        check("first-database-connection-closed", true);
      } else if (phase === "read") {
        const record = await store.getRecord("browser-persistence-check");
        const metadata = await store.getMetadata("browser-ci-meta");
        const events = await store.listEvents();
        check("record-survives-browser-reopen", Boolean(record && record.value === "survives-reopen" && record.revision === 1));
        check("metadata-survives-browser-reopen", Boolean(metadata && metadata.phase === "write" && metadata.origin === location.origin));
        check("event-survives-browser-reopen", events.some(item => item.id === "browser-ci-event"));
        await store.deleteRecord("browser-persistence-check");
        check("record-cleanup-completed", await store.getRecord("browser-persistence-check") === null);
        await store.dispose();
      } else {
        check("phase-parameter-valid", false);
        await store.dispose();
      }
      finish();
    } catch (error) {
      check("browser-test-execution", false);
      finish("\nERROR " + (error && error.stack ? error.stack : String(error)));
    }
  </script>
</body>
</html>
