name: Swar-Sadhika Rebuild Scaffold Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rebuild-scaffold-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Repository scaffold and progress validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate project progress record
        run: python tools/validate_progress.py .

      - name: Validate retained JSON
        run: python -m json.tool progress.json > /dev/null
