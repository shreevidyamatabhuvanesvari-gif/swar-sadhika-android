name: Swar-Sadhika JavaScript Regression Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Deliberately no concurrency cancellation: every single-file commit must receive its own test run.
jobs:
  regression:
    name: JavaScript regression audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check every JavaScript file
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            echo "Checking ${file}"
            node --experimental-default-type=module --check "${file}"
            count=$((count + 1))
          done < <(find assets/js -type f -name '*.js' -print0 | sort -z)
          test "${count}" -gt 0
          echo "Syntax check passed for ${count} JavaScript files."

      - name: Run Sanskrit and TTS module self-tests
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module --input-type=module <<'NODE'
          import { selfTest as testVedicPronunciation } from "./assets/js/tts/vedic-sanskrit-pronunciation.js";
          import { selfTest as testSanskritG2P } from "./assets/js/tts/sanskrit-g2p-engine.js";
          import { selfTest as testPronunciationCompiler } from "./assets/js/tts/sanskrit-pronunciation-compiler.js";
          import { selfTest as testTtsEngine } from "./assets/js/tts/tts-engine.js";
          import { selfTest as testAvatarTtsEngine, runIntegrationSelfTest as testAvatarTtsIntegration } from "./assets/js/tts/avatar-tts-engine.js";
          import { selfTest as testAvatarPage } from "./assets/js/pages/page-avatar.js";

          const suites = [
            ["Vedic pronunciation", testVedicPronunciation],
            ["Sanskrit G2P", testSanskritG2P],
            ["Pronunciation compiler", testPronunciationCompiler],
            ["TTS engine", testTtsEngine],
            ["Avatar TTS engine", testAvatarTtsEngine],
            ["Avatar page", testAvatarPage]
          ];

          let failed = false;
          for (const [name, run] of suites) {
            let result;
            try {
              result = run();
            } catch (error) {
              console.error(`FAIL ${name}: ${error?.stack || error}`);
              failed = true;
              continue;
            }
            const passed = result?.status === "PASSED" && result?.failed === 0;
            console.log(`${passed ? "PASS" : "FAIL"} ${name}: ${result?.passed ?? 0}/${result?.total ?? 0}`);
            if (!passed) {
              failed = true;
              for (const check of result?.checks || []) {
                if (!check.passed) console.error(`  - ${check.id}`);
              }
            }
          }
          try {
            const result = await testAvatarTtsIntegration();
            const passed = result?.status === "PASSED" && result?.failed === 0;
            console.log(`${passed ? "PASS" : "FAIL"} Avatar TTS integration: ${result?.passed ?? 0}/${result?.total ?? 0}`);
            if (!passed) {
              failed = true;
              for (const check of result?.checks || []) {
                if (!check.passed) console.error(`  - ${check.id}`);
              }
            }
          } catch (error) {
            console.error(`FAIL Avatar TTS integration: ${error?.stack || error}`);
            failed = true;
          }
          if (failed) process.exitCode = 1;
          NODE

      - name: Audit Sanskrit Display Studio HTML and JavaScript contract
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync, existsSync } from "node:fs";

          const htmlPath = "sanskrit-display-studio.html";
          const pagePath = "assets/js/pages/page-sanskrit-display-studio-part2.js";
          const html = readFileSync(htmlPath, "utf8");
          const page = readFileSync(pagePath, "utf8");

          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(match => match[1]);
          const duplicateIds = ids.filter((id, index) => ids.indexOf(id) !== index);
          assert.deepEqual(duplicateIds, [], "Studio HTML contains duplicate element IDs");

          const moduleScripts = [...html.matchAll(/<script[^>]*type=["']module["'][^>]*src=["']([^"']+)["'][^>]*>/g)];
          assert.equal(moduleScripts.length, 1, "Studio must load exactly one page module");
          const moduleUrlPath = moduleScripts[0][1].split("?")[0];
          const modulePath = moduleUrlPath.startsWith("./") ? moduleUrlPath.slice(2) : moduleUrlPath;
          assert.equal(modulePath, pagePath, "Studio module script points to the expected page module");
          assert.ok(existsSync(modulePath), `Studio module file is missing: ${modulePath}`);

          const htmlIds = new Set(ids);
          const dynamicIds = new Set([
            "studio-voice-tools",
            "studio-voice-refresh",
            "studio-voice-test",
            "studio-voice-status",
            "studio-record-preview",
            "studio-player-runtime-styles"
          ]);
          const references = [...page.matchAll(/byId\(["']([^"']+)["']\)/g)].map(match => match[1]);
          const missingIds = [...new Set(references.filter(id => !htmlIds.has(id) && !dynamicIds.has(id)))];
          assert.deepEqual(missingIds, [], "Page module references DOM IDs missing from Studio HTML");

          const requiredBindings = [
            ["avatar file binding", /studio-avatar-file["']\)\.addEventListener\("change", handleAvatarChange/],
            ["video file binding", /studio-video-file["']\)\.addEventListener\("change", handleVideoChange/],
            ["fullscreen binding", /studio-fullscreen-play["']\)\.addEventListener\("click", startFullscreenPlayback/],
            ["preview binding", /studio-play-preview["']\)\.addEventListener\("click"/],
            ["pause binding", /studio-pause["']\)\.addEventListener\("click", pausePlayback/],
            ["resume binding", /studio-resume["']\)\.addEventListener\("click", resumePlayback/],
            ["stop binding", /studio-stop["']\)\.addEventListener\("click"/],
            ["text input binding", /studio-text["']\)\.addEventListener\("input", updateTextPreview/]
          ];
          for (const [label, pattern] of requiredBindings) {
            assert.match(page, pattern, `Missing Studio event binding: ${label}`);
          }

          const playbackHelpers = [...page.matchAll(/^function\s+getPlaybackItemsFromLines\s*\(/gm)];
          assert.equal(playbackHelpers.length, 1, "Playback helper must have exactly one declaration");
          console.log("PASS Studio DOM IDs, page module path, and eight core event bindings.");
          NODE

      - name: Run Nano Brain foundation and Main App integration regression checks
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { existsSync, readFileSync } from "node:fs";
          import { assertBrainFoundationSelfTestPart2 } from "./assets/js/brain/brain-foundation-selftest-part2.js";

          // Run the same aggregate foundation suites used by the dedicated Brain workflow.
          const result = await assertBrainFoundationSelfTestPart2();
          assert.equal(result.status, "PASSED", "Nano Brain Foundation suite must pass");
          assert.equal(result.failed, 0, "Nano Brain Foundation must report zero failures");
          assert.equal(result.passed, result.total, "Every executed Brain assertion must pass");
          console.log(
            `PASS Nano Brain Foundation: ${result.passed}/${result.total}; skipped=${result.skipped.length}.`
          );

          // Verify the Brain page is wired through the existing lazy Page Loader.
          const app = readFileSync("assets/js/app.js", "utf8");
          const html = readFileSync("index.html", "utf8");
          const pagePath = "assets/js/pages/page-nano-brain-part2.js";

          assert.ok(existsSync(pagePath), "Nano Brain Page Module must exist");
          assert.match(
            app,
            /"nano-brain":\s*\{\s*id:\s*"nano-brain",\s*file:\s*"page-nano-brain-part2\.js"/,
            "Main Page Loader must declare the Nano Brain Part 2 route"
          );
          assert.match(app, /await import\(url\.href\)/, "Main Page Loader must lazy-import page modules");
          assert.match(html, /data-route=["']nano-brain["']/, "Index navigation must expose the Nano Brain route");
          assert.match(html, /id=["']view-nano-brain["']/, "Index must contain the Brain view mount point");
          assert.match(
            html,
            /<script[^>]*src=["']\.\/assets\/js\/app\.js["']/i,
            "Index must continue loading the existing app.js entry point"
          );
          assert.doesNotMatch(
            html,
            /<script[^>]*page-nano-brain-part2/i,
            "Nano Brain must not be added as an extra script tag"
          );
          console.log("PASS Nano Brain route, lazy loading, mount point, and unchanged entry-point contract.");
          NODE
      - name: Verify Index, TTS, and Brain Page Loader lifecycle contracts
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-default-type=module --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          const app = readFileSync("assets/js/app.js", "utf8");
          const html = readFileSync("index.html", "utf8");
          const tts = readFileSync("assets/js/pages/page-tts.js", "utf8");
          const brainPage = readFileSync("assets/js/pages/page-nano-brain-part2.js", "utf8");

          // Index owns the TTS controls, so its module uses the shared Page Loader lifecycle.
          assert.match(app,
            /const pageToActivate = page \|\| \(key === "index" \? PAGE_MODULES\["jump-text"\] : null\);/,
            "Index navigation must activate the existing TTS module");
          assert.match(app,
            /await hideActivePage\(pageToActivate \? pageToActivate\.id : null\);/,
            "Leaving Index must invoke the active TTS module onHide hook");
          assert.match(app,
            /await loadPageModule\(pageToActivate, navigationSequence\);/,
            "Returning to Index must reuse and reactivate the TTS module");
          assert.match(app,
            /if \(instance\.activated\) \{[\s\S]*?runPageHook\([\s\S]*?"onShow"/,
            "Reused Page Loader instances must receive onShow");
          assert.match(app, /await import\(url\.href\)/, "Page modules must remain lazy-loaded");
          assert.match(app, /createPageContext\(page, root\)/,
            "Page modules must receive the existing mount(context) contract");
          assert.match(tts, /async function onHide\(\)/, "TTS must implement onHide");
          assert.match(tts, /async function onShow\(\)/, "TTS must implement onShow");
          assert.match(tts, /return Object\.freeze\(\{ onShow, onHide, unmount \}\);/,
            "TTS must expose lifecycle hooks to the Page Loader");
          assert.doesNotMatch(app, /const indexTtsPage = PAGE_MODULES\["jump-text"\];/,
            "Startup must not perform a second separate TTS module load");

          // The Brain remains on the existing single app.js/Page Loader entry path.
          assert.match(app,
            /"nano-brain": \{ id: "nano-brain", file: "page-nano-brain-part2\.js"/,
            "The existing Brain route ID must remain intact");
          assert.match(brainPage, /export async function mount\(context\)/,
            "Brain Page must expose mount(context)");
          assert.match(html, /data-route=["']nano-brain["']/, "Index must retain the Brain route");
          const appEntryScripts = [...html.matchAll(/<script[^>]*src=["']\.\/assets\/js\/app\.js["'][^>]*>/gi)];
          assert.equal(appEntryScripts.length, 1, "Index must keep exactly one app.js entry point");
          assert.doesNotMatch(html, /<script[^>]*page-nano-brain-part2/i,
            "Brain must not be added as another script tag");

          console.log("PASS Index/TTS lifecycle, single-load behavior, Brain route and Page Loader contracts.");
          NODE
